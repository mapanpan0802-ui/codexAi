interface:
  display_name: "模块功能整理 v0.0.1"
  short_description: "整理模块功能与测试预期，生成支持新需求方案和代码修改的独立 AI 上下文"
  default_prompt: "请使用 $code-module-feature-map 整理指定模块，生成开发测试说明和独立AI上下文；第2节依次为2.1主业务流程总览、2.2主业务流程解析与数据影响：图用业务动作串主线并旁注地点，图后按主流程分组、每组一张七列表、一行一步，将目的/条件/规则/衔接写入业务解析列，将结束条件/结果/边界写入结果与下一步列，同时保留身份、地点、关联数据库和数据变化，使用相对链接；保留九节结构、页面四列表和三列报表，AI版保留独立重建分组表的事实，生成校验后登记项目AGENTS.md，功能更新同步图、合并表及模块索引。"
policy:
  allow_implicit_invocation: false

