interface:
  display_name: "模块功能整理 v0.0.1"
  short_description: "整理模块功能与测试预期，生成支持新需求方案和代码修改的独立 AI 上下文"
  default_prompt: "请使用 $code-module-feature-map 整理指定模块，生成开发测试说明和独立AI上下文；第2节首图完整展示主业务流程，逐条简短标明操作端及页面或触发来源，以主线为主、尽可能简洁，保留关键分支与出口；图后五列表保留完整角色、页面入口、处理及下一步，链接使用相对路径，多个功能ID可映射同一阶段；保留第3节页面四列表及三列报表，生成校验后登记项目AGENTS.md，功能更新同步文档与索引。"
policy:
  allow_implicit_invocation: false

