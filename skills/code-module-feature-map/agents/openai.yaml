interface:
  display_name: "模块功能整理 v0.0.1"
  short_description: "整理模块功能与测试预期，生成支持新需求方案和代码修改的独立 AI 上下文"
  default_prompt: "请使用 $code-module-feature-map 整理指定模块，生成开发测试说明和独立AI上下文；第2节主图用业务动作串起完整主流程，在步骤旁说明操作端及页面或触发来源，保留关键分支与出口、尽可能简洁；图下七列表说明业务动作、发起角色/来源、操作地点、关键处理、关联数据库/表、生成/变更的数据、结果与下一步，链接使用相对路径；保留第3节页面四列表及三列报表，生成校验后登记项目AGENTS.md，功能更新同步文档与索引。"
policy:
  allow_implicit_invocation: false

