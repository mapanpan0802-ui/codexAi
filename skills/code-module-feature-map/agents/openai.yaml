interface:
  display_name: "模块功能整理 v0.0.1"
  short_description: "整理模块功能与测试预期，生成支持新需求方案和代码修改的独立 AI 上下文"
  default_prompt: "请使用 $code-module-feature-map 整理指定模块，生成开发测试说明和独立AI上下文；第2节图与分组解析表只显示业务名称，不带字母节点或功能编号，地点旁注；保持七列，同一步多表连续拆行，每行一张数据库表，生成/变更的数据只说明本行表的读写、记录或字段/状态变化，保留差异入口、业务规则和结果边界；稳定ID及内部节点映射放AI和第9节，使用相对链接，保留九节结构及页面/字段/报表约定，生成后登记项目AGENTS.md并同步维护。"
policy:
  allow_implicit_invocation: false

