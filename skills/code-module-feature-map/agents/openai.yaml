interface:
  display_name: "模块功能整理 v0.0.1"
  short_description: "整理模块功能与测试预期，生成支持新需求方案和代码修改的独立 AI 上下文"
  default_prompt: "请使用 $code-module-feature-map 整理指定模块，生成全面、简洁明了的五节开发者说明：模块范围、业务流程、Map/枚举与字典、相关统计报表、优化建议；流程保留名称主图及地点旁注，分组五列表为业务流程、操作地点、业务解析、数据影响、结果与下一步，每个地点/操作一行，多表按表名【类型】：说明用 <br> 换行；必要页面/字段/按钮规则融入流程，不再独立生成字段、按钮、页面功能或证据章节，完整技术事实留独立AI上下文；使用相对链接，生成校验后登记项目AGENTS.md并同步维护。"
policy:
  allow_implicit_invocation: false

