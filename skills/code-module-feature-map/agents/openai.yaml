interface:
  display_name: "模块功能整理 v0.0.1"
  short_description: "整理模块功能与测试预期，生成支持新需求方案和代码修改的独立 AI 上下文"
  default_prompt: "请使用 $code-module-feature-map 整理指定模块，生成开发测试说明和独立AI上下文；主图用业务名称并旁注地点，图后按主流程分组，四列为操作地点、业务解析、数据影响、结果与下一步，不显示业务动作和发起角色/来源列；每个地点/具体操作一行，数据影响按表名【操作类型】：本表说明逐条用 <br> 换行，不按数据表拆行；保留业务规则/结果边界、完整入口及AI和第9节的角色/功能/请求/逐表证据映射，其他章节及相对链接约定不变，生成后登记项目AGENTS.md并同步维护。"
policy:
  allow_implicit_invocation: false

